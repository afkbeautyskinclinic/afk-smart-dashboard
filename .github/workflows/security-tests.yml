name: AFK Security Regression Tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/private-data-cache-and-media-links]
permissions:
  contents: read
jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.cjs
